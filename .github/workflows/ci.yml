name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core deps only — voice/redis/celery are optional)
        run: |
          python -m pip install --upgrade pip
          pip install Flask==3.0.3 Flask-SQLAlchemy==3.1.1 Flask-Login==0.6.3 \
                      PyJWT numpy scikit-learn pytest ruff
      - name: Lint
        run: ruff check book2trek tests
      - name: Tests
        run: pytest -q
      - name: Verification demo
        run: python -m book2trek.verification.pipeline
      - name: Latency benchmark (simulated)
        run: python -m book2trek.bench.latency -n 50
