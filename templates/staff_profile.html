{% extends 'base.html' %}

{% block title %}My Profile | Book2Trek{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="mb-4">
        <h1>My Profile</h1>
        <p class="text-muted">
            Manage your Book2Trek staff account.
        </p>
    </div>

    <div class="card p-4" style="max-width: 650px;">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ current_user.name }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                    type="email"
                    class="form-control"
                    value="{{ current_user.email }}"
                    disabled
                >
                <div class="form-text">
                    Email cannot be changed.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input
                    type="tel"
                    name="phone"
                    class="form-control"
                    value="{{ current_user.phone or '' }}"
                >
            </div>

            <hr>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Leave blank to keep current password"
                    minlength="6"
                >
            </div>

            <button type="submit" class="btn btn-success">
                Save Changes
            </button>

            <a href="{{ url_for('staff_dashboard') }}"
               class="btn btn-outline-secondary ms-2">
                Back to Dashboard
            </a>

        </form>

    </div>

</div>

{% endblock %}
